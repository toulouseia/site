name: Vérifier et mettre en ligne

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  verifier:
    name: Vérifications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Engendrer les types des routes Next
        run: npx next typegen

      - name: Vérifier les types de l'application
        run: npm run typecheck

      - name: Essais de la veille
        run: npm run veille:essais

      - name: Vérifier les numéros de la veille
        run: npm run veille:verifier

      - name: Vérifier les types du programme serveur
        run: npm run verifier:api

      - name: Vérifier le contenu et les animations
        run: npm run verifier

      - name: Vérifier le schéma de la base
        run: npm run verifier:schema

      - name: Construire le site
        run: npm run build

  deployer:
    name: Mise en ligne de la production
    needs: verifier
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier la présence des secrets Cloudflare
        run: |
          manque=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || manque="$manque CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || manque="$manque CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$manque" ]; then
            echo "::error title=Secrets manquants::Mise en ligne impossible, il manque les secrets du dépôt :$manque. Un administrateur doit les ajouter dans Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Vérifier que ce commit est encore le dernier de main
        id: dernier
        run: |
          tete=$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)
          if [ "$tete" = "$GITHUB_SHA" ]; then
            echo "oui=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Mise en ligne sautée::main a avancé jusqu'à ${tete:0:7}. Ce commit plus ancien ne part pas en ligne, le plus récent s'en charge."
            echo "oui=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le dépôt
        if: steps.dernier.outputs.oui == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Node 22
        if: steps.dernier.outputs.oui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        if: steps.dernier.outputs.oui == 'true'
        run: npm ci

      - name: Construire et mettre en ligne
        if: steps.dernier.outputs.oui == 'true'
        run: npm run deploy

      - name: Contrôler les pages en ligne
        if: steps.dernier.outputs.oui == 'true'
        run: |
          echec=0
          for chemin in /projets/ /veille/ /apprendre/ /outils/ /api/sante; do
            url="https://toulouseia.fr$chemin"
            code=""
            for essai in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error title=Contrôle en ligne::$url répond $code au lieu de 200"
              echec=1
            fi
          done
          exit $echec

  apercu:
    name: Aperçu de la pull request
    needs: verifier
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: apercu-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier la présence des secrets Cloudflare
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Aperçu sauté::Pas d'aperçu, les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID ne sont pas posés sur le dépôt."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer le dépôt
        if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Node 22
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        if: steps.secrets.outputs.present == 'true'
        run: npm ci

      - name: Construire et envoyer une version d'aperçu
        id: envoi
        if: steps.secrets.outputs.present == 'true'
        run: |
          npm run deploy:apercu 2>&1 | tee apercu.log
          url=$(grep -oE 'Version Preview URL: https://[^[:space:]]+' apercu.log | head -n 1 | sed 's/^Version Preview URL: //')
          if [ -z "$url" ]; then
            echo "::error title=Aperçu::wrangler n'a pas donné d'adresse d'aperçu. Vérifier que les adresses d'aperçu sont activées pour ce Worker."
            exit 1
          fi
          url="${url%/}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Aperçu : $url/veille/" >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le lien dans la pull request
        if: steps.secrets.outputs.present == 'true'
        uses: actions/github-script@v7
        env:
          APERCU: ${{ steps.envoi.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marque = "<!-- apercu-toulouseia -->";
            const url = process.env.APERCU;
            const corps = [
              marque,
              "**Aperçu de cette pull request**",
              "",
              `La veille : ${url}/veille/`,
              `La racine : ${url}/`,
              "",
              `Construit depuis ${process.env.SHA.slice(0, 7)}. Cet aperçu utilise la base et le bucket de production.`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const commentaires = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existant = commentaires.find((c) => c.user.type === "Bot" && c.body.includes(marque));
            if (existant) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existant.id, body: corps });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: corps });
            }
