<line x1="60.0" y1="640.0" x2="1320.0" y2="640.0" stroke="#D2CEC8" stroke-width="1.5" data-role="filet"/>
<text x="60.0" y="700.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="33" font-weight="700" fill="#14120F" text-anchor="start">avant + arrière = 2,20 × avant</text>
