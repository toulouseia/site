<text x="60.0" y="411.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="33" font-weight="400" fill="#565049" text-anchor="start">passe arrière</text>
<rect x="420.0" y="370.0" width="415.3" height="60.0" fill="#A8442A"/>
